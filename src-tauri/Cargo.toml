[package]
name = "plastikcad"
version = "0.1.0"
description = "Fast solid modelling for 3D printing: combine simple shapes into parts"
authors = ["Andrew O'Shei"]
license = "GPL-3.0-or-later"
homepage = "https://sheidesigns.com"
repository = "https://github.com/Shei-Designs/PlastikCAD"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plastikcad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Used from Rust only, so that files picked on Android (content:// URIs) can be read and written.
tauri-plugin-fs = "2"
# Opens the sign-in page in the system browser, on desktop and Android alike.
tauri-plugin-opener = "2"
# What the app is being driven with on Android: a hardware keyboard, or the on-screen keypad.
tauri-plugin-device = { path = "plugins/device" }
serde = { version = "1", features = ["derive"] }
# The plugins' settings in tauri.conf.json (the updater's) are built into the app as JSON.
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# Finds a newer version among the releases, checks it against the key in tauri.conf.json, and installs it.
tauri-plugin-updater = "2"
# The system's keychain, where the Google sign-in is kept: the Keychain on macOS, the Credential Manager on Windows,
# the Secret Service (GNOME Keyring, KWallet) on Linux, spoken to in Rust alone, with no system library to link.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

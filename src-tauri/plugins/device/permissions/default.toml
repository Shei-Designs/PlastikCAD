[default]
description = "Lets the app ask what it is being driven with (a hardware keyboard, the on-screen keypad) and hear when that changes. Lets it pick a folder and make documents in it; writing a picked document is done from the Rust side and needs no permission."
permissions = ["allow-state", "allow-register-listener", "allow-remove-listener", "allow-pick-folder", "allow-create-document"]

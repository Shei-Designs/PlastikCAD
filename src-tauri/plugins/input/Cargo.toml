[package]
name = "tauri-plugin-input"
version = "0.1.0"
description = "Tells BashCAD what it is being driven with: a hardware keyboard, or fingers and the on-screen keypad"
authors = ["Andrew O'Shei"]
license = "GPL-3.0-or-later"
edition = "2021"
links = "tauri-plugin-input"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

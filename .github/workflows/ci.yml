name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is named by the commit it was read at, with its version beside it: a tag can be moved to other
# code, a commit cannot. To take a newer one, put its commit here and its version in the note.

# The jobs read the repository and nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    # A run takes some ten minutes. One that has not ended by now is stuck, and is stopped rather than left to the six-hour limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # The Rust side: the file commands, the sign-in listener, the projects folder.
      - name: Install Linux dependencies
        run: |
          .github/scripts/apt-mirror.sh
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # The parts of the Rust side that only exist on the other desktops are at least compiled there.
  compile:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: cargo check
        working-directory: src-tauri

  # The reference robots exported and run in MuJoCo: they load, stand, drive and reach.
  robots:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install mujoco gymnasium
      # The cameras' pictures are drawn without a display: Mesa's software renderer stands in for one.
      - run: .github/scripts/apt-mirror.sh && sudo apt-get install -y libosmesa6
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:robots
        env:
          MUJOCO_GL: osmesa

  # The app in a browser: fingers and the mouse on the plate, the panels and menus, and the core flows.
  e2e:
    # The tests with a mouse and keyboard and the tests with fingers run side by side, each on a runner of its own:
    # together on one they came to take 15 to 23 minutes as the suite grew, too near the limit below for a slow runner.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, tablet]
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-22.04
    # A run takes several minutes. One that has not ended by now is stuck, and is stopped rather than left to the six-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser's system libraries come from the package mirrors, which are looked at first.
      - run: .github/scripts/apt-mirror.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project ${{ matrix.project }}
      # What went wrong, to open in a browser: the report, with the trace of each test that was tried again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            e2e-report/
            e2e-results/
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # The Rust side: the file commands, the sign-in listener, the projects folder.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # The parts of the Rust side that only exist on the other desktops are at least compiled there.
  compile:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check
        working-directory: src-tauri

  # The reference robots exported and run in MuJoCo: they load, stand, drive and reach.
  robots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install mujoco gymnasium
      # The cameras' pictures are drawn without a display: Mesa's software renderer stands in for one.
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:robots
        env:
          MUJOCO_GL: osmesa

  # The app in a browser: fingers and the mouse on the plate, the panels and menus, and the core flows.
  e2e:
    # The tests with a mouse and keyboard and the tests with fingers run side by side, each on a runner of its own:
    # together on one they came to take 15 to 23 minutes as the suite grew, too near the limit below for a slow runner.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, tablet]
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-22.04
    # A run takes several minutes. One that has not ended by now is stuck, and is stopped rather than left to the six-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project ${{ matrix.project }}
      # What went wrong, to open in a browser: the report, with the trace of each test that was tried again.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            e2e-report/
            e2e-results/
          retention-days: 14
